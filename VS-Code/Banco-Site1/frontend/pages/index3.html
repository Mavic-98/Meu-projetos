<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco Digital - Projeto Acadêmico</title>
    <link rel="stylesheet" href="../styles/estilo.css">
</head>
<body>
    <div class="container">
        <!-- Tela 3: Meus Cartões -->
        <div class="tela tela-cartoes">
            <div class="cabecalho">
                <h2>MEUS CARTÕES</h2>
            </div>

            <div class="cartao-visao">
                <div class="bandeira">VISA</div>
                <div class="saldo-cartao">$ 3.540,25</div>
                <div class="dados-cartao">
                    <span>5213 6450 5408 7016</span>
                    <span>07/22</span>
                </div>
            </div>

            <div class="campos-cartao">
                <div class="campo">
                    <label>Número do Cartão</label>
                    <input type="text" value="5213 6450 5408 7016" readonly>
                </div>
                <div class="campo-linha">
                    <div class="campo pequeno">
                        <label>Validade</label>
                        <input type="text" value="07/22" readonly>
                    </div>
                    <div class="campo pequeno">
                        <label>CVV</label>
                        <input type="text" value="725" readonly>
                    </div>
                </div>
            </div>

            <div class="transacoes">
                <div class="transacao">
                    <div class="nome-transacao">McDonalds</div>
                    <div class="valor-transacao negativo">-$ 32,77</div>
                </div>
                <div class="transacao">
                    <div class="nome-transacao">Hospital Familiar</div>
                    <div class="valor-transacao positivo">+ $ 124,68</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
