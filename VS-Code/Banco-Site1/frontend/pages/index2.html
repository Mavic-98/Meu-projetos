<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco Digital - Projeto Acadêmico</title>
    <link rel="stylesheet" href="../styles/estilo.css">
</head>
<body>
    <div class="container">
        <!-- Tela 2: Atividades e Movimentações -->
        <div class="tela tela-atividades">
            <div class="cabecalho">
                <h2>ATIVIDADES</h2>
            </div>

            <div class="grafico-saldo">
                <div class="circulo-grafico">
                    <span class="valor-saldo">$ 3.540,25</span>
                </div>
            </div>

            <div class="filtro-meses">
                <span class="mes ativo">Jul</span>
                <span class="mes">Ago</span>
                <span class="mes">Set</span>
                <span class="mes">Out</span>
            </div>

            <div class="categorias">
                <div class="categoria">
                    <div class="icone-categoria">🛒</div>
                    <div class="info-categoria">
                        <span class="nome">Supermercado</span>
                        <span class="valor">$ 542,36</span>
                    </div>
                    <button class="btn-ver">VER</button>
                </div>

                <div class="categoria">
                    <div class="icone-categoria">👕</div>
                    <div class="info-categoria">
                        <span class="nome">Compras</span>
                        <span class="valor">$ 175,20</span>
                    </div>
                    <button class="btn-ver">VER</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
