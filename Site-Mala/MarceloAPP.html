<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcelo - Orçamentos</title>
    <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23facc15' d='M13 2L3 14h7l-1 8 10-12h-7z'/></svg>" type="image/svg+xml">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            @page { margin: 0; }
            body {
                background: white;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                margin: 1cm;
            }
            .print-hidden { display: none !important; }
            .print-border-none { border: none !important; }
            #print-area { box-shadow: none; border: none; width: 100%; max-width: 100%; }
        }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ path, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {path}
            </svg>
        );

        const Icons = {
            Plus: (props) => <Icon {...props} path={<><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></>} />,
            Trash2: (props) => <Icon {...props} path={<><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></>} />,
            Printer: (props) => <Icon {...props} path={<><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></>} />,
            Save: (props) => <Icon {...props} path={<><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></>} />,
            FileText: (props) => <Icon {...props} path={<><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></>} />,
            Zap: (props) => <Icon {...props} path={<><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></>} />,
            Settings: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></>} />,
            History: (props) => <Icon {...props} path={<><path d="M3 3v5h5"></path><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"></path></>} />,
            Calculator: (props) => <Icon {...props} path={<><rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="14" x2="16" y2="14"></line><line x1="8" y1="14" x2="8" y2="14"></line><line x1="12" y1="14" x2="12" y2="14"></line><line x1="8" y1="18" x2="8" y2="18"></line><line x1="12" y1="18" x2="12" y2="18"></line><line x1="16" y1="18" x2="16" y2="18"></line></>} />,
            RefreshCw: (props) => <Icon {...props} path={<><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></>} />,
            Upload: (props) => <Icon {...props} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></>} />
        };

        // --- APLICATIVO ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('create');
            const [items, setItems] = useState([]);
            const [clientName, setClientName] = useState('');
            const [clientAddress, setClientAddress] = useState('');
            const [quoteDate, setQuoteDate] = useState(new Date().toISOString().split('T')[0]);
            const [newItem, setNewItem] = useState({ description: '', quantity: 1, price: 0 });
            const [savedQuotes, setSavedQuotes] = useState([]);
            const [notification, setNotification] = useState(null);
            const [isUploading, setIsUploading] = useState(false);

            useEffect(() => {
                const saved = localStorage.getItem('marcelo_orcamentos');
                if (saved) {
                    setSavedQuotes(JSON.parse(saved));
                }
            }, []);

            const formatCurrency = (value) => {
                return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
            };

            const showNotification = (message) => {
                setNotification(message);
                setTimeout(() => setNotification(null), 3000);
            };

            const handleAddItem = () => {
                if (!newItem.description || newItem.price <= 0) {
                    showNotification('Por favor, preencha a descrição e um valor válido.');
                    return;
                }
                setItems([...items, { ...newItem, id: Date.now(), total: newItem.quantity * newItem.price }]);
                setNewItem({ description: '', quantity: 1, price: 0 });
            };

            const handleRemoveItem = (id) => {
                setItems(items.filter(item => item.id !== id));
            };

            const calculateTotal = () => {
                return items.reduce((acc, item) => acc + (item.price * item.quantity), 0);
            };

            const handleFileUpload = async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            if (file.type !== 'application/pdf') {
                showNotification('Por favor, selecione um arquivo PDF.');
                return;
            }

            setIsUploading(true);
            const formData = new FormData();
            formData.append('file', file);

            try {
                // Envia para o servidor Python que está rodando localmente
                const response = await fetch('http://127.0.0.1:8000/extrair-orcamento/', {
                    method: 'POST',
                    body: formData,
                });

                const data = await response.json();

                if (response.ok) {
                    // Adiciona os itens retornados pelo Python na sua lista atual
                    const novosItens = data.itens.map((item, index) => ({
                        id: Date.now() + index + Math.random(), // ID único
                        description: item.description,
                        quantity: Number(item.quantity), // Garante que é número
                        price: Number(item.price),       // Garante que é número
                        total: Number(item.quantity) * Number(item.price) // Calcula o total do item
                    }));
            
                    setItems(prevItems => [...prevItems, ...novosItens]);
                    showNotification(`Importado: ${data.filename}`);
                } else {
                    showNotification(data.erro || 'Erro ao processar PDF.');
                }
            } catch (error) {
                console.error("Erro na requisição:", error);
                showNotification('Erro ao conectar com o servidor. Verifique se o Python está rodando.');
            } finally {
                setIsUploading(false);
                event.target.value = ''; // Limpa o input
            }
            };

            const handleSaveQuote = () => {
                if (items.length === 0 || !clientName) {
                    showNotification('Preencha o nome do cliente e adicione itens antes de salvar.');
                    return;
                }

                const quote = {
                    id: Date.now(),
                    clientName,
                    clientAddress,
                    date: quoteDate,
                    items,
                    total: calculateTotal()
                };

                const newHistory = [quote, ...savedQuotes];
                setSavedQuotes(newHistory);
                localStorage.setItem('marcelo_orcamentos', JSON.stringify(newHistory));
                showNotification('Orçamento salvo com sucesso no histórico!');
            };

            const handleClear = () => {
                if (items.length > 0 || clientName) {
                    if (!window.confirm('Tem certeza que deseja limpar o formulário para um novo orçamento?')) return;
                }
                setClientName('');
                setClientAddress('');
                setItems([]);
                setQuoteDate(new Date().toISOString().split('T')[0]);
                setNewItem({ description: '', quantity: 1, price: 0 });
                showNotification('Campos limpos para novo orçamento.');
            };

            const loadQuote = (quote) => {
                setClientName(quote.clientName);
                setClientAddress(quote.clientAddress || '');
                setQuoteDate(quote.date);
                setItems(quote.items);
                setActiveTab('create');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const deleteQuote = (id) => {
                if (window.confirm('Tem certeza que deseja excluir este orçamento do histórico?')) {
                    const newHistory = savedQuotes.filter(q => q.id !== id);
                    setSavedQuotes(newHistory);
                    localStorage.setItem('marcelo_orcamentos', JSON.stringify(newHistory));
                    showNotification('Orçamento removido.');
                }
            };

            const handlePrint = () => {
                window.print();
            };

            return (
                <div className="min-h-screen bg-slate-100 font-sans text-slate-800">
                    
                    {notification && (
                        <div className="fixed top-4 right-4 bg-slate-800 text-white px-4 py-2 rounded shadow-lg z-50 animate-bounce">
                            {notification}
                        </div>
                    )}

                    <nav className="bg-slate-900 text-white p-4 shadow-md print-hidden">
                        <div className="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-2 font-bold text-xl text-yellow-500">
                                <Icons.Zap className="h-6 w-6" />
                                <span>Marcelo App</span>
                            </div>
                            <div className="flex gap-4">
                                <button 
                                    onClick={() => setActiveTab('create')}
                                    className={`flex items-center gap-2 px-3 py-1 rounded transition ${activeTab === 'create' ? 'bg-yellow-500 text-slate-900' : 'hover:bg-slate-700'}`}
                                >
                                    <Icons.FileText className="h-4 w-4" /> Orçamento
                                </button>
                                <button 
                                    onClick={() => setActiveTab('history')}
                                    className={`flex items-center gap-2 px-3 py-1 rounded transition ${activeTab === 'history' ? 'bg-yellow-500 text-slate-900' : 'hover:bg-slate-700'}`}
                                >
                                    <Icons.History className="h-4 w-4" /> Histórico
                                </button>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-5xl mx-auto p-4 md:p-8">
                        
                        {activeTab === 'create' && (
                            <div className="bg-white shadow-xl rounded-lg overflow-hidden border border-slate-200 fade-in" id="print-area">
                                
                                <div className="bg-slate-900 text-white p-8 border-b-4 border-yellow-500 flex flex-col md:flex-row justify-between items-start md:items-center">
                                    <div className="flex items-center gap-4 mb-4 md:mb-0">
                                        <div className="bg-yellow-500 p-3 rounded-full text-slate-900 shadow-lg">
                                            <Icons.Settings className="h-8 w-8" />
                                        </div>
                                        <div>
                                            <h1 className="text-3xl font-bold uppercase tracking-wider">Marcelo</h1>
                                            <p className="text-yellow-500 font-semibold text-sm tracking-widest uppercase">Eletricista Industrial & Automação</p>
                                            <div className="text-xs text-slate-400 mt-1 space-y-0.5">
                                                <p>Instalações Elétricas • Painéis de Comando • Manutenção</p>
                                                <p>Contato: (91) 99153-0344 | meletricista98@gmail.com</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <h2 className="text-2xl font-bold text-slate-200">ORÇAMENTO</h2>
                                        <div className="text-slate-400">
                                           Data: 
                                           <input 
                                             type="date" 
                                             value={quoteDate}
                                             onChange={(e) => setQuoteDate(e.target.value)}
                                             className="bg-transparent border-none text-slate-400 focus:ring-0 p-0 ml-2 w-32 text-right"
                                           />
                                        </div>
                                    </div>
                                </div>

                                <div className="p-8">
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                                        <div className="space-y-2">
                                            <label className="block text-sm font-medium text-slate-600">Cliente / Empresa</label>
                                            <input 
                                                type="text" 
                                                value={clientName}
                                                onChange={(e) => setClientName(e.target.value)}
                                                placeholder="Nome do Cliente ou Empresa"
                                                className="w-full p-2 border border-slate-300 rounded focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500 outline-none print-border-none print-p-0 print-font-bold print-text-lg"
                                            />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="block text-sm font-medium text-slate-600">Endereço / Local do Serviço</label>
                                            <input 
                                                type="text" 
                                                value={clientAddress}
                                                onChange={(e) => setClientAddress(e.target.value)}
                                                placeholder="Endereço completo"
                                                className="w-full p-2 border border-slate-300 rounded focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500 outline-none print-border-none print-p-0"
                                            />
                                        </div>
                                    </div>

                                    <div className="mb-8 bg-slate-50 p-4 rounded border border-slate-200 print-hidden">
                                        <div className="flex justify-between items-center mb-3">
                                            <h3 className="font-bold text-slate-700 mb-3 flex items-center gap-2">
                                                <Icons.Calculator className="h-5 w-5" /> Adicionar Serviço/Peça
                                            </h3>
                                            <div className="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
                                                <div className="md:col-span-6">
                                                    <label className="block text-xs text-slate-500 mb-1">Descrição do Serviço</label>
                                                    <input 
                                                        type="text" 
                                                        value={newItem.description}
                                                        onChange={(e) => setNewItem({...newItem, description: e.target.value})}
                                                        placeholder="Ex: Instalação de Inversor de Frequência"
                                                        className="w-full p-2 border border-slate-300 rounded"
                                                    />
                                                </div>
                                                <div className="md:col-span-2">
                                                    <label className="block text-xs text-slate-500 mb-1">Qtd</label>
                                                    <input 
                                                        type="number" 
                                                        min="1"
                                                        value={newItem.quantity}
                                                        onChange={(e) => setNewItem({...newItem, quantity: Number(e.target.value)})}
                                                        className="w-full p-2 border border-slate-300 rounded"
                                                    />
                                                </div>
                                                <div className="md:col-span-3">
                                                    <label className="block text-xs text-slate-500 mb-1">Valor Unitário (R$)</label>
                                                    <input 
                                                        type="number" 
                                                        min="0"
                                                        step="0.01"
                                                        value={newItem.price}
                                                        onChange={(e) => setNewItem({...newItem, price: Number(e.target.value)})}
                                                        className="w-full p-2 border border-slate-300 rounded"
                                                    />
                                                </div>
                                                <div className="md:col-span-1">
                                                    <button 
                                                        onClick={handleAddItem}
                                                        className="w-full bg-slate-900 text-white p-2.5 rounded hover:bg-slate-700 transition flex justify-center items-center">
                                                        <Icons.Plus className="h-5 w-5" />
                                                    </button>
                                                </div>
                                                <div className="relative">
                                                    <input
                                                        type="file" 
                                                        accept=".pdf" 
                                                        onChange={handleFileUpload} 
                                                        className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                                                        disabled={isUploading}
                                                    />
                                                    <button className={`flex items-center gap-2 px-3 py-1.5 rounded text-sm font-medium transition ${isUploading ? 'bg-slate-300 text-slate-500' : 'bg-slate-800 text-white hover:bg-slate-700'}`}>
                                                        <Icons.Upload className="h-4 w-4" /> 
                                                        {isUploading ? 'Lendo PDF...' : 'Importar de PDF'}
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="mb-8">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="border-b-2 border-slate-800">
                                                    <th className="py-2 font-bold text-slate-800 w-16">QTD</th>
                                                    <th className="py-2 font-bold text-slate-800">DESCRIÇÃO</th>
                                                    <th className="py-2 font-bold text-slate-800 text-right w-32">UNITÁRIO</th>
                                                    <th className="py-2 font-bold text-slate-800 text-right w-32">TOTAL</th>
                                                    <th className="py-2 w-10 print-hidden"></th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {items.length > 0 ? (
                                                    items.map((item) => (
                                                        <tr key={item.id} className="border-b border-slate-200 hover:bg-slate-50 print-hover-bg-white">
                                                            <td className="py-3 text-slate-600">{item.quantity}</td>
                                                            <td className="py-3 font-medium text-slate-800">{item.description}</td>
                                                            <td className="py-3 text-slate-600 text-right">{formatCurrency(item.price)}</td>
                                                            <td className="py-3 font-bold text-slate-800 text-right">{formatCurrency(item.price * item.quantity)}</td>
                                                            <td className="py-3 text-center print-hidden">
                                                                <button onClick={() => handleRemoveItem(item.id)} className="text-red-500 hover:text-red-700">
                                                                    <Icons.Trash2 className="h-4 w-4" />
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))
                                                ) : (
                                                    <tr>
                                                        <td colSpan="5" className="py-8 text-center text-slate-400 italic">
                                                            Nenhum serviço adicionado ainda.
                                                        </td>
                                                    </tr>
                                                )}
                                            </tbody>
                                            <tfoot>
                                                <tr className="bg-slate-100 print-bg-transparent border-t-2 border-slate-800">
                                                    <td colSpan="3" className="py-4 text-right font-bold text-xl uppercase pr-4">Total Geral</td>
                                                    <td className="py-4 text-right font-bold text-xl text-slate-900 bg-yellow-400 print-bg-transparent print-border print-border-slate-800 px-2">
                                                        {formatCurrency(calculateTotal())}
                                                    </td>
                                                    <td className="print-hidden"></td>
                                                </tr>
                                            </tfoot>
                                        </table>
                                    </div>

                                    <div className="mt-12 pt-8 border-t border-slate-300 text-center text-sm text-slate-500">
                                        <p className="font-bold text-slate-700">Validade do Orçamento: 15 dias</p>
                                        <p className="mt-1">Pagamento: 50% na aprovação / 50% na entrega.</p>
                                        <p className="mt-4 text-xs">Obrigado pela preferência!</p>
                                    </div>

                                </div>

                                <div className="bg-slate-100 p-4 border-t border-slate-200 flex justify-end gap-3 print-hidden">
                                    <button 
                                        onClick={handleClear}
                                        className="flex items-center gap-2 bg-white text-slate-700 border border-slate-300 px-4 py-2 rounded font-medium hover:bg-slate-50 transition shadow-sm"
                                    >
                                        <Icons.RefreshCw className="h-4 w-4" /> Limpar / Novo
                                    </button>
                                    <button 
                                        onClick={handleSaveQuote}
                                        className="flex items-center gap-2 bg-green-600 text-white px-6 py-2 rounded font-medium hover:bg-green-700 transition shadow-sm"
                                    >
                                        <Icons.Save className="h-4 w-4" /> Salvar
                                    </button>
                                    <button 
                                        onClick={handlePrint}
                                        className="flex items-center gap-2 bg-slate-900 text-white px-6 py-2 rounded font-medium hover:bg-slate-700 transition shadow-sm"
                                    >
                                        <Icons.Printer className="h-4 w-4" /> Imprimir / PDF
                                    </button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'history' && (
                            <div className="bg-white shadow rounded-lg p-6 fade-in">
                                <h2 className="text-2xl font-bold mb-6 flex items-center gap-2 text-slate-800">
                                    <Icons.History className="h-6 w-6 text-yellow-500" /> Histórico de Orçamentos
                                </h2>
                                
                                {savedQuotes.length === 0 ? (
                                    <div className="text-center py-12 text-slate-500 bg-slate-50 rounded border border-dashed border-slate-300">
                                        <Icons.FileText className="h-12 w-12 mx-auto mb-3 opacity-30" />
                                        <p>Nenhum orçamento salvo ainda.</p>
                                    </div>
                                ) : (
                                    <div className="grid gap-4">
                                        {savedQuotes.map(quote => (
                                            <div key={quote.id} className="border border-slate-200 rounded p-4 flex flex-col md:flex-row justify-between items-center hover:shadow-md transition bg-slate-50">
                                                <div className="mb-4 md:mb-0 text-center md:text-left">
                                                    <h3 className="font-bold text-lg text-slate-800">{quote.clientName}</h3>
                                                    <p className="text-sm text-slate-500">{new Date(quote.date).toLocaleDateString('pt-BR')} • {quote.items.length} itens</p>
                                                </div>
                                                <div className="flex items-center gap-4">
                                                    <span className="font-bold text-lg text-slate-700">{formatCurrency(quote.total)}</span>
                                                    <div className="flex gap-2">
                                                        <button 
                                                            onClick={() => loadQuote(quote)}
                                                            className="p-2 text-blue-600 hover:bg-blue-100 rounded"
                                                            title="Abrir / Editar"
                                                        >
                                                            <Icons.FileText className="h-5 w-5" />
                                                        </button>
                                                        <button 
                                                            onClick={() => deleteQuote(quote.id)}
                                                            className="p-2 text-red-600 hover:bg-red-100 rounded"
                                                            title="Excluir"
                                                        >
                                                            <Icons.Trash2 className="h-5 w-5" />
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
